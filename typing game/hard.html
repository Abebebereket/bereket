<!DOCTYPE html>
<!-- By Ali Aslan -->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">  
    <title>Typing Speed Test Game | M.S.P </title>
    <link rel="stylesheet" href="css/hard.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
 
    <div class="wrapper">
      <div class="main_text">The game starts as soon as you begin typing!</div>
      <input type="text" class="input-field">
      <div class="content-box">
      
        <div class="typing-text">
          <p></p>
        </div>
        <div class="content">
          <ul class="result-details">
            <li class="time">
              <p>Time Left:</p>
              <span><b>60</b>s</span>
            </li>
            <li class="mistake">
              <p>Mistakes:</p>
              <span>0</span>
            </li>
            <li class="wpm">
              <p>WPM:</p>
              <span>0</span>
            </li>
            <li class="cpm">
              <p>CPM:</p>
              <span>0</span>
            </li>                            
          </ul>
          <button>Try Again</button>
          <button  onclick="history.back()">Exit </button>
        
        </div>
        
      </div>

      <div class="footer">
        <span></span>
      </div>
      
    </div>


    <script src="js/hard-paragraphs.js"></script>
    <script src="js/hard-script.js"></script>
  
  </body>
</html>
